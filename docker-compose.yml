services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # overrides the .env value so the backend reaches the `db` service
      # instead of its own container's localhost
      DATABASE_URL: postgresql://user:pass@db:5432/gdrive
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        # Must be a build arg, not env_file: NEXT_PUBLIC_* is inlined into
        # the client bundle at build time, so a runtime value never reaches it.
        NEXT_PUBLIC_UPLOAD_MAX_SIZE: "10485760"
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      # used by middleware.ts for server-to-server calls, where
      # "localhost" would otherwise resolve to the frontend container itself
      INTERNAL_API_URL: http://backend:3001
    depends_on:
      - backend
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: gdrive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gdrive"]
      interval: 5s
      timeout: 5s
      retries: 10